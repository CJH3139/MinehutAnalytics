name: MinehutAnalytics

options:
  bundleIdPrefix: com.cjh3139
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  MinehutKit:
    path: MinehutKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    WORKER_BASE_URL: "https://minehut-analytics.imnotnotcjh.workers.dev"

targets:
  MinehutAnalytics:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MinehutKit
      - target: MinehutAnalyticsWidget
        embed: true
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Minehut Analytics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.cjh3139.minehutanalytics
            CFBundleURLSchemes: [minehutanalytics]
        WorkerBaseURL: $(WORKER_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cjh3139.minehutanalytics
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MinehutAnalyticsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: MinehutKit
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Minehut Analytics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WorkerBaseURL: $(WORKER_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cjh3139.minehutanalytics.widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
