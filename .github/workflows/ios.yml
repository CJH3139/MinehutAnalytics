name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/validate_ios_bundle.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  test-kit:
    name: Test MinehutKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: ios/MinehutKit
        run: swift test

  build-ipa:
    name: Build unsigned IPA
    needs: test-kit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MinehutAnalytics.xcodeproj \
            -scheme MinehutAnalytics \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MinehutAnalytics.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Validate embedded widget
        run: python3 scripts/validate_ios_bundle.py "$RUNNER_TEMP/MinehutAnalytics.xcarchive/Products/Applications/MinehutAnalytics.app"
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/MinehutAnalytics.xcarchive/Products/Applications/MinehutAnalytics.app" "$RUNNER_TEMP/ipa/Payload/"
          test -d "$RUNNER_TEMP/ipa/Payload/MinehutAnalytics.app/PlugIns/MinehutAnalyticsWidget.appex"
          cd "$RUNNER_TEMP/ipa"
          zip -qry MinehutAnalytics.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinehutAnalytics-ipa
          path: ${{ runner.temp }}/ipa/MinehutAnalytics.ipa
          if-no-files-found: error
